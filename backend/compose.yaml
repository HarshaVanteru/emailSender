# API uses the database configured in backend/.env. Schema upgrades are explicit.
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "gmail-sync", "--concurrency=2", "--loglevel=INFO"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 35s
    restart: unless-stopped

  maintenance-worker:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "gmail-maintenance", "--concurrency=1", "--loglevel=INFO"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-worker:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "gmail-ai", "--concurrency=1", "--loglevel=INFO"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
