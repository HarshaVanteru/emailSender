# Backend: build an image, push it to GHCR, then tell the server to pull it.

name: backend

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

# One deploy at a time per branch.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: emailsender-backend
  DEPLOY_DIR: /var/www/html/emailsender
  SERVICE_NAME: emailsender

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR image names must be lowercase.
      - name: Work out the image name
        id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${owner}/${IMAGE_BASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true

          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $SERVER_HOST
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF

      - name: Pull new image and restart API
        run: |
          ssh deploy "BACKEND_IMAGE='$IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_PAT='$GHCR_PAT' DEPLOY_DIR='$DEPLOY_DIR' SERVICE_NAME='$SERVICE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"

          echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          export BACKEND_IMAGE
          touch .env
          grep -v '^BACKEND_IMAGE=' .env > .env.next || true
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> .env.next
          mv .env.next .env

          docker compose pull "$SERVICE_NAME"
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Check API health
        run: |
          ssh deploy "DEPLOY_DIR='$DEPLOY_DIR' SERVICE_NAME='$SERVICE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4999/api/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done

          echo "The API was not ready within 60 seconds" >&2
          curl -sS -o /dev/null -w 'Last /api/health status: %{http_code}\n' \
            http://127.0.0.1:4999/api/health || true

          cd "$DEPLOY_DIR"
          docker compose logs --tail=80 "$SERVICE_NAME"
          exit 1
          REMOTE
