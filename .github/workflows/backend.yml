# Backend: test, publish one image, migrate, and deploy the four-service stack.

name: backend

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/deploy/**"
      - ".github/tests/**"

  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/deploy/**"
      - ".github/tests/**"

  workflow_dispatch:
    inputs:
      baseline_legacy_database:
        description: "One-time legacy setup: confirm database backup is complete and worker writes are paused"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Avoid cancelling a running migration or deployment.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: emailsender-backend
  DEPLOY_DIR: /var/www/html/emailsender

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend regression tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          GROQ_API_KEY: test-not-real
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose -f backend/compose.yaml config --quiet
          BACKEND_IMAGE=ghcr.io/example/emailsender-backend:validation \
            docker compose --project-directory backend --env-file backend/.env \
            -f .github/deploy/compose.yaml config --quiet
          diff -u <(printf '%s\n' emailsender redis scheduler worker | sort) \
            <(BACKEND_IMAGE=ghcr.io/example/emailsender-backend:validation \
              docker compose --project-directory backend --env-file backend/.env \
              -f .github/deploy/compose.yaml config --services | sort)
      - name: Validate deployment script syntax
        run: bash -n .github/deploy/backend.sh
      - name: Deployment sequencing regression tests
        run: python -m unittest discover -s .github/tests -v

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR image names must be lowercase.
      - name: Work out the image name
        id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${owner}/${IMAGE_BASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true

          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: emailsender-production
      cancel-in-progress: false
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
      BASELINE_LEGACY_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_legacy_database && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $SERVER_HOST
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF

      - name: Upload deployment bundle
        run: |
          ssh deploy "mkdir -p '$DEPLOY_DIR/.deploy/$GITHUB_SHA'"
          rsync -az --chmod=D700,F600 .github/deploy/ "deploy:$DEPLOY_DIR/.deploy/$GITHUB_SHA/"

      - name: Log the server into GHCR
        id: registry_login
        run: |
          printf '%s' "$GHCR_PAT" | ssh deploy "docker login '$REGISTRY' --username '$GHCR_USERNAME' --password-stdin"

      - name: Drain workers, migrate database, and deploy all four services
        run: |
          ssh deploy "DEPLOY_DIR='$DEPLOY_DIR' BACKEND_IMAGE='$IMAGE' BASELINE_LEGACY_DATABASE='$BASELINE_LEGACY_DATABASE' bash '$DEPLOY_DIR/.deploy/$GITHUB_SHA/backend.sh'"

      - name: Clear server registry credentials
        if: ${{ always() && (steps.registry_login.outcome == 'success' || steps.registry_login.outcome == 'failure') }}
        run: ssh deploy "docker logout '$REGISTRY'" >/dev/null 2>&1 || true
